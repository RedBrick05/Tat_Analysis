<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>webR Diagnostic Tool (jsonlite patched)</title>

<style>
body { font-family: ui-sans-serif, system-ui; margin: 20px; }
#log {
  white-space: pre-wrap;
  background: #f0f0f0;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  max-width: 900px;
}
</style>

<script type="module">
import { WebR } from "https://webr.r-wasm.org/latest/webr.mjs";

function log(msg) {
  document.getElementById("log").textContent += msg + "\n";
}

async function ensurePackage(webR, pkg) {
  log(`📦 Checking package: ${pkg}…`);
  const pkgs = await webR.evalR("installed.packages()[,1]").then(x => x.toArray());

  if (!pkgs.includes(pkg)) {
    log(`   ➜ Installing ${pkg}…`);
    await webR.installPackages(pkg);
    log(`   ✔ Installed ${pkg}`);
  } else {
    log(`   ✔ ${pkg} already installed`);
  }
}

async function main() {
  log("Initializing…");

  const webR = new WebR();
  await webR.init();
  log("Starting webR…");
  log("webR ready.\n");

  // 🔧 Ensure required R packages are available
  await ensurePackage(webR, "jsonlite");

  log("📦 All required packages ready.\n");

  // 📂 Create diagnostic directory
  await webR.evalR(`dir.create('/home/web_user/tat_diag', recursive=TRUE, showWarnings=FALSE)`);

  const input = document.getElementById("fileInput");
  input.addEventListener("change", async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;

    log(`📄 Reading file: ${file.name}`);
    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);

    const target = "/home/web_user/tat_diag/input.csv";
    webR.FS.writeFile(target, bytes);
    log(`💾 Saved → ${target}`);

    log("🔍 Running CSV diagnostics…");

    // R DIAGNOSTICS CODE
    const rCode = `
      library(jsonlite)

      out <- list()
      out$file_exists <- file.exists("${target}")

      if (out$file_exists) {
        raw <- readLines("${target}", warn=FALSE)
        out$lines <- length(raw)
        out$first_10_lines <- head(raw, 10)

        df <- try(read.csv("${target}", stringsAsFactors=FALSE), silent=TRUE)
        if (inherits(df, "try-error")) {
          out$parse_error <- as.character(df)
        } else {
          out$columns <- names(df)
          out$n_rows <- nrow(df)
        }
      }

      write(
        toJSON(out, pretty=TRUE, auto_unbox=TRUE),
        "/home/web_user/tat_diag/diag_result.json"
      )

      write("Diagnostic test OK", "/home/web_user/tat_diag/test.txt")
    `;

    try {
      await webR.evalR(rCode);
      log("✅ Diagnostics created.");
    } catch (err) {
      log("❌ R error during diagnostics: " + err.message);
    }

    // 🗂 LIST FILES (correct method)
    log("\n📁 Listing /home/web_user (via R)...");
    const list1 = await webR.evalR(`list.files('/home/web_user', recursive=TRUE)`).then(x => x.toArray());
    log(list1.join("\n"));

    log("\n📁 Listing /home/web_user/tat_diag...");
    const list2 = await webR.evalR(`list.files('/home/web_user/tat_diag', recursive=TRUE)`).then(x => x.toArray());
    log(list2.join("\n"));

    log("\nDone.");
  });
}

main();
</script>
</head>

<body>
<h2>webR Diagnostic Tool</h2>
<p>Upload your CSV to confirm structure and verify that webR can read it properly.</p>
<input type="file" id="fileInput" />
<pre id="log">Loading…</pre>
</body>
</html>
