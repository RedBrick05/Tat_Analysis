<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agreement TAT — Violin Plots (plots5_dark)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<script type="module" src="https://webr.r-wasm.org/latest/webr.mjs"></script>

<style>
  :root{
    --bg:#0b1220;
    --card:#0f1724;
    --muted:#9ca3af;
    --accent:#2563eb;
    --ok:#10b981;
    --err:#ef4444;
    --glass: rgba(255,255,255,0.04);
    --text:#e6eef6;
  }
  body{margin:18px;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px}
  h1{margin:0;font-size:1.2rem}
  #statusBox{margin-top:10px;padding:12px;border-radius:10px;background:var(--card);border:1px solid rgba(255,255,255,0.03);font-family:ui-monospace, SFMono-Regular, Menlo, monospace;white-space:pre-wrap}
  .controls{display:flex;gap:10px;align-items:center;margin-top:12px}
  .btn{background:var(--accent);color:white;padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
  .btn.secondary{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,0.06)}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);margin-top:14px}
  .plots{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
  .plot-card{background:white;padding:6px;border-radius:8px;box-shadow:0 6px 18px rgba(2,6,23,0.6);color:#111}
  .plot-card h3{margin:6px 0;font-size:1rem}
  .small{font-size:0.9rem;color:var(--muted)}
  .spinner{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,0.06);border-top-color:var(--accent);animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
  .status-line{display:flex;align-items:center;gap:8px;margin:6px 0}
  .status-ok{color:var(--ok);font-weight:700}
  .status-err{color:var(--err);font-weight:700}
  @keyframes spin{to{transform:rotate(360deg)}}
  pre.svgbox{margin:0;padding:6px;max-height:480px;overflow:auto}
  .download-row{display:flex;gap:8px;align-items:center;margin-top:6px}
  @media(min-width:900px){ .plots{grid-template-columns:1fr 1fr} }
</style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Agreement TAT — Violin Plots (dark UI)</h1>
      <div class="small">Plots use light backgrounds for legibility and export</div>
    </header>

    <div id="statusBox">
      Initializing… (starting webR).<br>
    </div>

    <div class="controls">
      <input id="csvFile" type="file" accept=".csv" />
      <button id="fetchBtn" class="btn secondary">Fetch CSV from server</button>
      <button id="runBtn" class="btn" disabled>Generate plots</button>
      <a id="help" class="btn secondary" href="#" title="How to use">Help</a>
    </div>

    <div id="notes" class="small" style="margin-top:8px">
      <strong>CSV source:</strong> Built-in fetch URL is provided (will be replaced by your environment). <em>If fetch fails, upload manually.</em>
    </div>

    <div id="outputArea"></div>

    <div id="plots" class="plots"></div>
  </div>

<script type="module">
import { WebR } from "https://webr.r-wasm.org/latest/webr.mjs";

const CSV_URL = "/mnt/data/Report_Dump_UTF8.csv"; // <-- environment will transform this path to a URL; set to null to disable auto-fetch
const statusBox = document.getElementById('statusBox');
const fileInput = document.getElementById('csvFile');
const fetchBtn = document.getElementById('fetchBtn');
const runBtn = document.getElementById('runBtn');
const plotsDiv = document.getElementById('plots');
const outputArea = document.getElementById('outputArea');

function appendStatusLine(text, cls){
  const line = document.createElement('div');
  line.className = 'status-line';
  if(cls === 'ok') { line.innerHTML = `<span class="status-ok">✔</span><div>${text}</div>`; }
  else if(cls === 'err') { line.innerHTML = `<span class="status-err">✖</span><div>${text}</div>`; }
  else { line.innerHTML = `<div>${text}</div>`; }
  statusBox.appendChild(line);
  statusBox.scrollTop = statusBox.scrollHeight;
}

function setStatus(text){
  statusBox.textContent = text;
}

let webR = null;

async function initWebR_and_packages(){
  setStatus("Initializing webR...");
  try {
    webR = new WebR();
    await webR.init();
    appendStatusLine("webR ready.", 'ok');

    // packages to ensure
    const pkgs = ["ggplot2","dplyr","patchwork","jsonlite"];
    for(const p of pkgs){
      appendStatusLine(`Checking ${p}...`);
      try {
        // check quickly
        await webR.evalR(`suppressWarnings(requireNamespace("${p}", quietly=TRUE))`);
        try { await webR.evalR(`library(${p})`); appendStatusLine(`${p} loaded.`, 'ok'); }
        catch(e){ appendStatusLine(`${p} not loaded — installing...`); await webR.installPackages(p); await webR.evalR(`library(${p})`); appendStatusLine(`${p} installed.`, 'ok'); }
      } catch(e){
        appendStatusLine(`${p} install error: ${String(e)}`, 'err');
      }
    }
    appendStatusLine("Initialization complete — ready for CSV.", 'ok');
    runBtn.disabled = false;
  } catch(e){
    setStatus("webR init failed: " + (e && e.message ? e.message : String(e)));
    throw e;
  }
}

// initialize
initWebR_and_packages().catch(e=>console.error(e));

fileInput.addEventListener('change', () => {
  runBtn.disabled = !fileInput.files[0];
});

fetchBtn.addEventListener('click', async () => {
  appendStatusLine(`Attempting to fetch CSV from: ${CSV_URL}`);
  try {
    if(!CSV_URL){ appendStatusLine("Fetch disabled (CSV_URL is null).", 'err'); return; }
    const resp = await fetch(CSV_URL);
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    // set a virtual file blob into file input by creating a File and using DataTransfer trick
    const blob = new Blob([text], {type: "text/csv"});
    const file = new File([blob], (CSV_URL.split('/').pop()||'data.csv'), {type:'text/csv'});
    const dataTransfer = new DataTransfer();
    dataTransfer.items.add(file);
    fileInput.files = dataTransfer.files;
    appendStatusLine("CSV fetched and loaded into uploader.", 'ok');
    runBtn.disabled = false;
  } catch(err){
    appendStatusLine("Fetch failed: " + String(err), 'err');
  }
});

runBtn.addEventListener('click', async () => {
  plotsDiv.innerHTML = '';
  outputArea.innerHTML = '';
  appendStatusLine("Starting plot generation...", null);
  runBtn.disabled = true;

  // read CSV from file input (fallback)
  let csvText = null;
  if(fileInput.files && fileInput.files[0]){
    try {
      csvText = await fileInput.files[0].text();
      appendStatusLine(`Read ${fileInput.files[0].name} (${fileInput.files[0].size} bytes)`, 'ok');
    } catch(e){
      appendStatusLine("Failed to read file in browser: " + e, 'err');
      runBtn.disabled = false;
      return;
    }
  } else {
    appendStatusLine("No CSV available (upload or fetch first).", 'err');
    runBtn.disabled = false;
    return;
  }

  // Escape ${ sequences that could break template injection
  function escapeTemplateDollar(s){ return s.replace(/\$\{/g, "\\${"); }
  const safeText = escapeTemplateDollar(csvText);
  const jsText = JSON.stringify(safeText);

  appendStatusLine("Sending CSV into webR (direct text injection) ...");

  // R script: robust; wrap column names with backticks; plots with white background
  const rScript = `
suppressWarnings({
  library(ggplot2); library(dplyr); library(patchwork); library(jsonlite)

  txt <- ${jsText}
  tmpf <- tempfile(fileext = '.csv')
  writeLines(txt, tmpf)
  df <- try(read.csv(tmpf, stringsAsFactors=FALSE, check.names=FALSE, na.strings=c('','NA')), silent=TRUE)
  if(inherits(df, 'try-error')) stop(paste0('CSV parse error: ', as.character(df)))
  names(df) <- trimws(names(df))

  # Column names exactly as expected
  tat <- "Agreement Turn Around Time (TAT, days)"
  type <- "Agreement Type"
  legal <- "Legal Reference Number"
  parties <- "Number of Related Parties"

  # ensure numeric
  df[[tat]] <- suppressWarnings(as.numeric(df[[tat]]))
  df <- df %>% filter(!is.na(.data[[tat]]))

  make_svg <- function(d, xexpr, yexpr, title, ylim=NULL){
    tryCatch({
      p <- ggplot(d, aes_string(x=xexpr, y=yexpr)) +
           geom_violin(alpha=0.6, trim=TRUE) +
           geom_jitter(width=0.12, alpha=0.45, size=0.9) +
           stat_summary(fun=median, geom='point', shape=23, size=3, fill='red') +
           stat_summary(fun=mean, geom='point', shape=21, size=3, fill='white') +
           labs(title=title, x='', y='TAT (days)') +
           theme_minimal() + theme(plot.background = element_rect(fill='white', color=NA), panel.background = element_rect(fill='white', color=NA), axis.text.x = element_text(angle=45, hjust=1))

      if(!is.null(ylim)) p <- p + coord_cartesian(ylim=ylim)
      fn <- tempfile(fileext='.svg')
      ggsave(fn, plot=p, device='svg', width=10, height=4, bg='white')
      paste(readLines(fn, warn=FALSE), collapse='\\n')
    }, error=function(e){
      paste0('R_error::', as.character(e))
    })
  }

  out <- list()
  out$full_all <- make_svg(df, "'All'", paste0('`', tat, '`'), "TAT — All Agreements")

  if(type %in% names(df)) out$by_type <- make_svg(df, paste0('`', type, '`'), paste0('`', tat, '`'), "TAT by Agreement Type")
  if(legal %in% names(df)) out$by_legal <- make_svg(df, paste0('`', legal, '`'), paste0('`', tat, '`'), "TAT by Legal Review")
  if(parties %in% names(df)){
    df2 <- df
    df2[[parties]] <- suppressWarnings(as.numeric(as.character(df2[[parties]])))
    df2 <- df2 %>% filter(!is.na(.data[[parties]]))
    df2[[parties]] <- factor(df2[[parties]], levels=sort(unique(df2[[parties]])))
    out$by_parties <- make_svg(df2, paste0('`', parties, '`'), paste0('`', tat, '`'), "TAT by Number of Related Parties")
  }

  out$days_0_100 <- make_svg(df %>% filter(.data[[tat]] >= 0 & .data[[tat]] <= 100), "'All'", paste0('`', tat, '`'), "TAT (0–100 days)", c(0,100))
  dlog <- df %>% mutate(TAT_log = log10(.data[[tat]] + 1))
  out$log <- make_svg(dlog, "'All'", "TAT_log", "TAT (log10)")
  out$days_0_59 <- make_svg(df %>% filter(.data[[tat]] >= 0 & .data[[tat]] <= 59), "'All'", paste0('`', tat, '`'), "TAT (0–59 days)", c(0,59))
  out$log_0_59 <- make_svg(df %>% filter(.data[[tat]] >= 0 & .data[[tat]] <= 59) %>% mutate(TAT_log = log10(.data[[tat]] + 1)), "'All'", "TAT_log", "TAT (0–59 log)")

  toJSON(out, auto_unbox=TRUE)
})
`;

  try {
    appendStatusLine("Running R code (this may take a while; package downloads cached after first run)...");
    const rres = await webR.evalR(rScript);
    const arr = await rres.toArray();
    const json = arr[0];
    const obj = JSON.parse(json);

    appendStatusLine("Plots generated — rendering...", 'ok');

    // Render plots grid
    for(const key of Object.keys(obj)){
      const svgStr = obj[key];
      const card = document.createElement('div'); card.className = 'plot-card';
      const title = document.createElement('h3'); title.textContent = key.replace(/_/g,' ');
      card.appendChild(title);

      if(typeof svgStr === 'string' && svgStr.startsWith('R_error::')){
        const err = document.createElement('div'); err.className = 'err'; err.textContent = svgStr;
        card.appendChild(err);
      } else {
        const holder = document.createElement('div');
        // insert SVG markup
        holder.innerHTML = svgStr;
        card.appendChild(holder);

        const dlRow = document.createElement('div'); dlRow.className = 'download-row';
        const blob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `${key}.svg`; a.className='btn'; a.textContent='⬇️ Download SVG';
        dlRow.appendChild(a);
        card.appendChild(dlRow);
      }
      plotsDiv.appendChild(card);
    }

    appendStatusLine("✅ All plots displayed.", 'ok');
  } catch(e){
    appendStatusLine("R execution error: " + (e && e.message ? e.message : String(e)), 'err');
    try {
      // attempt to fetch a bit of R output / sessionInfo
      const si = await webR.evalR("paste(capture.output(sessionInfo()), collapse='\\n')");
      const siArr = await si.toArray();
      if(siArr && siArr[0]) appendStatusLine("R sessionInfo available.", null);
    } catch(_) {}
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
