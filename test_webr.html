<!DOCTYPE html>
<html>
<body>
<div id="log">Loading…</div>

<script type="module">
import { WebR } from "https://webr.r-wasm.org/latest/webr.mjs";

const log = msg => {
  document.getElementById("log").innerText += "\n" + msg;
};

async function run() {
  log("Initializing webR…");

  const webR = new WebR();
  await webR.init();

  log("webR ready!");

  // Evaluate R expression
  const res = await webR.evalR("1 + 1");

  // Convert to a clean JS array
  const arr = await res.toArray();

  // arr is e.g. [2]
  log("R says: " + arr[0]);
}

run();
</script>
</body>
</html>
