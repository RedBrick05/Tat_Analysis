<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agreement TAT — Violin Plots</title>
<script type="module" src="https://webr.r-wasm.org/latest/webr.mjs"></script>

<style>
  body{font-family:system-ui,Arial;margin:20px;}
  #status{white-space:pre-wrap;background:#f5f5f5;padding:10px;border-radius:8px;}
  .plot{margin-top:20px;border:1px solid #ddd;padding:10px;border-radius:8px;}
  button{padding:8px 14px;border-radius:6px;border:none;background:#2563eb;color:white;}
</style>
</head>

<body>
<h1>Agreement TAT — Violin Plots</h1>

<div id="status">Initializing WebR…</div>

<input type="file" id="csvFile" accept=".csv" />
<button id="runBtn" disabled>Generate Plots</button>

<div id="plots"></div>

<script type="module">
import { WebR } from "https://webr.r-wasm.org/latest/webr.mjs";

const log = msg => {
  const st = document.getElementById("status");
  st.textContent += "\\n" + msg;
  console.log(msg);
};

let webR;

async function init(){
  webR = new WebR();
  await webR.init();
  log("WebR ready.");

  for(const pkg of ["ggplot2","dplyr","patchwork","jsonlite"]){
    try{
      await webR.evalR(`suppressWarnings(library(${pkg}))`);
      log(`✔ Loaded ${pkg}`);
    } catch(e){
      log(`Installing ${pkg}...`);
      await webR.installPackages(pkg);
      log(`✔ Installed ${pkg}`);
    }
  }

  document.getElementById("runBtn").disabled = false;
}

await init();



document.getElementById("runBtn").onclick = async () => {
  const file = document.getElementById("csvFile").files[0];
  if(!file){ alert("Choose a CSV file first."); return; }

  const text = await file.text();
  const jsText = JSON.stringify(text);  // escape safely for R

  log("Reading CSV and generating plots…");

  const rCode = `
suppressWarnings({
  library(ggplot2); library(dplyr); library(patchwork); library(jsonlite)

  txt <- ${jsText}
  tmp <- tempfile(fileext=".csv")
  writeLines(txt, tmp)

  df <- read.csv(tmp, stringsAsFactors=FALSE, check.names=FALSE, na.strings=c("", "NA"))
  names(df) <- trimws(names(df))

  tat <- "Agreement Turn Around Time (TAT, days)"
  type <- "Agreement Type"
  legal <- "Legal Reference Number"
  parties <- "Number of Related Parties"

  df[[tat]] <- suppressWarnings(as.numeric(df[[tat]]))
  df <- df %>% filter(!is.na(.data[[tat]]))

  make_svg <- function(data, xvar, yvar, title, ylim=NULL){
    xq <- paste0("\\\`", xvar, "\\\`")
    yq <- paste0("\\\`", yvar, "\\\`")

    p <- ggplot(data, aes_string(x=xq, y=yq)) +
         geom_violin(alpha=.6, trim=TRUE) +
         geom_jitter(width=0.15, alpha=.4, size=.8) +
         stat_summary(fun=median, geom="point", shape=23, size=3, fill="red") +
         stat_summary(fun=mean, geom="point", shape=21, size=3, fill="white") +
         labs(title=title, x="", y="TAT (days)") +
         theme_minimal() +
         theme(axis.text.x=element_text(angle=45, hjust=1))

    if(!is.null(ylim)) p <- p + coord_cartesian(ylim=ylim)

    fn <- tempfile(fileext=".svg")
    ggsave(fn, p, device="svg", width=10, height=4)
    paste(readLines(fn, warn=FALSE), collapse="\\n")
  }

  out <- list()
  out$full <- make_svg(df, "All", tat, "TAT - All Agreements")

  if(type %in% names(df))
    out$by_type <- make_svg(df, type, tat, "TAT by Agreement Type")

  if(legal %in% names(df))
    out$by_legal <- make_svg(df, legal, tat, "TAT by Legal Reference Number")

  if(parties %in% names(df)){
    df2 <- df
    df2[[parties]] <- suppressWarnings(as.numeric(as.character(df2[[parties]])))
    df2 <- df2 %>% filter(!is.na(.data[[parties]]))
    df2[[parties]] <- factor(df2[[parties]], levels=sort(unique(df2[[parties]])))
    out$by_parties <- make_svg(df2, parties, tat, "TAT by Number of Related Parties")
  }

  toJSON(out, auto_unbox=TRUE)
})
`;

  try{
    const res = await webR.evalR(rCode);
    const arr = await res.toArray();
    const output = JSON.parse(arr[0]);

    const plotsDiv = document.getElementById("plots");
    plotsDiv.innerHTML = "";

    for(const key in output){
      const svg = output[key];
      const div = document.createElement("div");
      div.className = "plot";
      div.innerHTML = `<h3>${key}</h3>` + svg;
      plotsDiv.appendChild(div);
    }

    log("✔ Plots generated.");
  }
  catch(err){
    log("❌ ERROR: " + err.message);
  }
};

</script>
</body>
</html>
