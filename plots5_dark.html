<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agreement TAT — Violin Plots (dark)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<script type="module" src="https://webr.r-wasm.org/latest/webr.mjs"></script>

<style>
  :root{
    --bg:#0b1220; --card:#0f1724; --muted:#9ca3af; --accent:#06b6d4; --ok:#10b981; --err:#ef4444; --glass: rgba(255,255,255,0.03);
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,#071023 0%, #081426 100%);color:#e6eef6;font-family:var(--font)}
  .wrap{max-width:1100px;margin:24px auto;padding:18px}
  header{display:flex;align-items:center;gap:12px}
  h1{margin:0;font-size:1.25rem}
  p.lead{margin:4px 0 0;color:var(--muted);font-size:0.95rem}
  #status{margin-top:12px;padding:12px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015));border:1px solid rgba(255,255,255,0.03);font-family:ui-monospace, SFMono-Regular, Menlo, monospace;white-space:pre-wrap;max-height:200px;overflow:auto}
  .controls{display:flex;gap:12px;margin-top:14px;align-items:center}
  input[type=file]{color:var(--muted)}
  button{padding:8px 12px;border-radius:8px;border:none;background:var(--accent);color:#05202a;font-weight:600;cursor:pointer}
  button.alt{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
  .plots{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}
  .card{background:linear-gradient(180deg, rgba(255,255,255,0.012), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);padding:12px;border-radius:10px}
  .card h3{margin:0 0 8px;font-size:1rem}
  .spinner{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,0.06);border-top-color:var(--accent);animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ok{color:var(--ok);font-weight:700}
  .err{color:var(--err);font-weight:700}
  .small{font-size:0.9rem;color:var(--muted)}
  a.download{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--ok);color:#041614;text-decoration:none;font-weight:600}
  .svg-holder { border-radius:8px; overflow:auto; background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005)); padding:8px }
  footer{margin-top:18px;color:var(--muted);font-size:0.85rem}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Agreement TAT — Violin Plots (dark)</h1>
        <p class="lead">Upload CSV or use the sample file. Plots use a dark theme and are downloadable as SVG.</p>
      </div>
    </header>

    <div id="status" class="card">Initializing webR…</div>

    <div class="controls">
      <input id="csvFile" type="file" accept=".csv" />
      <button id="runBtn" disabled>Generate plots</button>
      <button id="sampleBtn" class="alt">Load server sample</button>
      <div style="margin-left:auto" id="readyFlag" class="small">Status: <span id="readyTxt">starting</span></div>
    </div>

    <div id="plots" class="plots"></div>

    <footer>tips: use HTTPS (GitHub Pages). If packages are installing it may take ~20–40s first run.</footer>
  </div>

<script type="module">
import { WebR } from "https://webr.r-wasm.org/latest/webr.mjs";

const statusEl = document.getElementById('status');
const fileInput = document.getElementById('csvFile');
const runBtn = document.getElementById('runBtn');
const sampleBtn = document.getElementById('sampleBtn');
const plotsDiv = document.getElementById('plots');
const readyTxt = document.getElementById('readyTxt');

function log(msg){
  const now = new Date().toISOString().slice(11,19);
  statusEl.textContent += `\n[${now}] ${msg}`;
  statusEl.scrollTop = statusEl.scrollHeight;
  console.log(msg);
}
function setStatus(msg){ statusEl.textContent = msg; }
function clearPlots(){ plotsDiv.innerHTML = ''; }

let webR = null;
let initialized = false;

// IMPORTANT: server-side sample path (developer note). Your system will transform if needed.
const SERVER_SAMPLE_PATH = "/mnt/data/Report_Dump_UTF8.csv";

async function initWebR(){
  setStatus("Initializing webR...");
  try {
    webR = new WebR();
    await webR.init();
    log("✅ webR ready.");
    readyTxt.textContent = "webR ready";
    initialized = true;
  } catch (e) {
    setStatus("❌ webR init failed: " + (e && e.message ? e.message : String(e)));
    console.error(e);
    return;
  }

  // packages list
  const pkgs = ["ggplot2","dplyr","patchwork","jsonlite"];
  for(const pkg of pkgs){
    log(`📦 Ensuring ${pkg}...`);
    try {
      await webR.evalR(`suppressWarnings(requireNamespace("${pkg}", quietly=TRUE))`);
      // try loading; if fails, install
      try { await webR.evalR(`library(${pkg})`); log(`   ✅ ${pkg} ready.`); }
      catch(e){
        log(`   ➜ Installing ${pkg} (this may take a few seconds)...`);
        await webR.installPackages(pkg);
        await webR.evalR(`library(${pkg})`);
        log(`   ✅ ${pkg} installed.`);
      }
    } catch(e){
      log(`   ❌ ${pkg} error: ${e && e.message ? e.message : String(e)}`);
    }
  }

  log("\n✅ Initialization complete — ready for file upload.");
  readyTxt.textContent = "ready for file";
  runBtn.disabled = false;
}

// kick off
initWebR();

fileInput.addEventListener('change', () => runBtn.disabled = !fileInput.files[0]);

// helper to escape ${ in text to prevent template interpolation surprises
function escapeDollar(txt){
  return txt.replace(/\$\{/g,"\\${");
}

// build and run R script to detect columns, rename to safe names, and plot
async function runPlotsFromText(csvText){
  clearPlots();
  setStatus("📄 Sending CSV into R…");
  log("📄 Sending CSV into R…");

  // protect against template interpolation issues
  const safeText = escapeDollar(csvText);
  const jsText = JSON.stringify(safeText); // will be safe to inject

  // R script: detect TAT, type, legal, parties columns by regex and rename them to safe names
  const rScript = `
suppressWarnings({
  library(ggplot2); library(dplyr); library(patchwork); library(jsonlite)

  txt <- ${jsText}
  tmpf <- tempfile(fileext = '.csv')
  writeLines(txt, tmpf)

  df <- try(read.csv(tmpf, stringsAsFactors=FALSE, check.names=FALSE, na.strings=c('','NA')), silent=TRUE)
  if(inherits(df,'try-error')) stop(paste0('CSV parse error: ', as.character(df)))

  names(df) <- trimws(names(df))

  # find columns by pattern (case-insensitive)
  find_col <- function(pattern){
    nm <- names(df)
    hits <- grep(pattern, nm, ignore.case=TRUE, value=TRUE)
    if(length(hits)>0) hits[1] else NA
  }

  col_tat <- find_col('TAT|Turn.?Around|Turn Around|Turn-Around|Agreement Turn')
  col_type <- find_col('Agreement.?Type|Type$|Agreement Type')
  col_legal <- find_col('Legal|Legal Reference|Legal Reference Number')
  col_parties <- find_col('Related Parties|Number of Related|Parties|No\\. of|Number of Related Parties')

  # make a copy and rename to safe names
  safe <- df
  if(!is.na(col_tat)) names(safe)[names(safe)==col_tat] <- 'TAT'
  if(!is.na(col_type)) names(safe)[names(safe)==col_type] <- 'Type'
  if(!is.na(col_legal)) names(safe)[names(safe)==col_legal] <- 'Legal'
  if(!is.na(col_parties)) names(safe)[names(safe)==col_parties] <- 'Parties'

  # coerce TAT to numeric
  if('TAT' %in% names(safe)) safe$TAT <- suppressWarnings(as.numeric(as.character(safe$TAT)))
  safe <- safe %>% filter(!is.na(TAT))

  # helper to create a dark-themed ggplot and return SVG string
  make_svg <- function(d, xcol, ycol, title, ylim=NULL, is_log=FALSE){
    tryCatch({
      p <- ggplot(d, aes_string(x = xcol, y = ycol)) +
           geom_violin(fill='#1f2937', color='#60a5fa', alpha=0.6, trim=TRUE) +
           geom_jitter(width=0.12, alpha=0.6, size=0.9, color='#c7f9ff') +
           stat_summary(fun=median, geom='point', shape=23, size=3, fill='#f97316') +
           stat_summary(fun=mean, geom='point', shape=21, size=2.6, fill='#ffffff') +
           labs(title=title, x='', y='TAT (days)') +
           theme_minimal(base_size=12) +
           theme(plot.background = element_rect(fill='#071225', color=NA),
                 panel.background = element_rect(fill='#071225', color=NA),
                 panel.grid.major = element_line(color='#0b2a37'),
                 panel.grid.minor = element_line(color='#061822'),
                 text = element_text(color='#e6eef6'),
                 axis.text = element_text(color='#c7d2da'),
                 plot.title = element_text(size=13, face='bold', color='#e6eef6'))

      if(!is.null(ylim)) p <- p + coord_cartesian(ylim=ylim)
      svgf <- tempfile(fileext='.svg')
      svg(svgf, width=10, height=4)
      print(p)
      dev.off()
      paste(readLines(svgf, warn=FALSE), collapse='\\n')
    }, error=function(e){
      paste0('R_error::', as.character(e))
    })
  }

  out <- list()
  out$meta <- list(rows=nrow(safe), detected = list(TAT = ifelse(is.na(col_tat), NA, col_tat),
                                                     Type = ifelse(is.na(col_type), NA, col_type),
                                                     Legal = ifelse(is.na(col_legal), NA, col_legal),
                                                     Parties = ifelse(is.na(col_parties), NA, col_parties)))
  # All agreements single group
  out$full <- make_svg(safe, "'All'", 'TAT', 'TAT — All Agreements')

  if('Type' %in% names(safe)) out$by_type <- make_svg(safe, 'Type', 'TAT', 'TAT by Agreement Type')
  if('Legal' %in% names(safe)) out$by_legal <- make_svg(safe, 'Legal', 'TAT', 'TAT by Legal Review')
  if('Parties' %in% names(safe)){
    safe$Parties <- suppressWarnings(as.numeric(as.character(safe$Parties)))
    safe2 <- safe %>% filter(!is.na(Parties))
    safe2$Parties <- factor(safe2$Parties, levels = sort(unique(safe2$Parties)))
    out$by_parties <- make_svg(safe2, 'Parties', 'TAT', 'TAT by Number of Related Parties')
  }

  # variants
  out$days_0_100 <- make_svg(safe %>% filter(TAT >=0 & TAT <= 100), "'All'", 'TAT', 'TAT (0–100 days)', c(0,100))
  out$log <- make_svg(safe %>% mutate(TAT_log = log10(TAT + 1)), "'All'", 'TAT_log', 'TAT (log10)')
  out$days_0_59 <- make_svg(safe %>% filter(TAT >=0 & TAT <= 59), "'All'", 'TAT', 'TAT (0–59 days)', c(0,59))
  out$log_0_59 <- make_svg(safe %>% filter(TAT >=0 & TAT <= 59) %>% mutate(TAT_log = log10(TAT + 1)), "'All'", 'TAT_log', 'TAT (0–59 log)')

  toJSON(out, auto_unbox=TRUE)
})
  `;

  // run R code
  try {
    const rres = await webR.evalR(rScript);
    const arr = await rres.toArray();
    const json = arr[0];
    const obj = JSON.parse(json);

    // show meta
    appendStatus(`✅ Parsed rows: ${obj.meta.rows}`);
    appendStatus(`Detected columns: ${JSON.stringify(obj.meta.detected)}`);

    // render plots
    for(const key of Object.keys(obj)){
      if(key === 'meta') continue;
      const svgOrErr = obj[key];
      const card = document.createElement('div'); card.className='card';
      const title = document.createElement('h3'); title.textContent = key.replace(/_/g,' ');
      card.appendChild(title);

      if(typeof svgOrErr === 'string' && svgOrErr.startsWith('R_error::')){
        const err = document.createElement('div'); err.className='err'; err.textContent = svgOrErr;
        card.appendChild(err);
      } else {
        const wrapper = document.createElement('div'); wrapper.className = 'svg-holder';
        wrapper.innerHTML = svgOrErr;
        card.appendChild(wrapper);
        const blob = new Blob([svgOrErr], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `${key}.svg`; a.className='download'; a.textContent='⬇️ Download SVG';
        card.appendChild(a);
      }
      plotsDiv.appendChild(card);
    }

    setStatus("✅ Plots generated.");
    log("✅ Plots generated.");
  } catch(e){
    setStatus("❌ R execution error: " + (e && e.message ? e.message : String(e)));
    console.error(e);
  }
}

// UI helpers
function appendStatus(line){
  statusEl.textContent += "\n" + line;
  statusEl.scrollTop = statusEl.scrollHeight;
}
function setStatus(msg){
  statusEl.textContent = msg;
}

// run via upload
runBtn.addEventListener('click', async ()=>{
  plotsDiv.innerHTML = '';
  setStatus("⏳ Preparing CSV...");
  const f = fileInput.files[0];
  if(!f){ setStatus("❌ No file selected"); return; }
  const text = await f.text();
  await runPlotsFromText(text);
});

// run via server sample path (developer will turn path into URL as needed)
sampleBtn.addEventListener('click', async ()=>{
  plotsDiv.innerHTML = '';
  setStatus("⏳ Fetching server sample...");
  try {
    // This path is expected to be transformed to a reachable URL by your environment.
    const url = "${SERVER_SAMPLE_PATH}";
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('fetch failed: ' + resp.status);
    const txt = await resp.text();
    await runPlotsFromText(txt);
  } catch(err){
    setStatus("❌ Failed to fetch sample file: " + (err && err.message ? err.message : String(err)));
  }
});

</script>
</body>
</html>
